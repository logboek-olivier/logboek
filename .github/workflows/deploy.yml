name: deploy

on:
  push:
    branches: [main]
  # Dagelijks opnieuw bouwen, zodat public/rates.json de nieuwste ECB-koersen heeft (de ECB publiceert rond 16:00 CET).
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Wisselkoersen: ECB-referentiekoersen als public/rates.json (zelfde origin, CSP ongewijzigd).
      - run: npm run rates
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
