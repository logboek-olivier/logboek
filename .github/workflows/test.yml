name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Playwright-browsers installeren
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - name: Build
        run: npm run build
