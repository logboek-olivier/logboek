name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Vast op 24.04: op het nieuwe ubuntu-latest (Ubuntu 26) blijft de Playwright-installatie met --with-deps hangen.
    runs-on: ubuntu-24.04
    # De installatiestappen duren soms ruim 10 minuten; de tests zelf ongeveer 4.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Playwright-browsers installeren
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      # Schermafbeeldingen van elk scherm (360 en 412 px, licht en donker) om vóór het mergen te bekijken.
      - name: Schermafbeeldingen uploaden
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schermafbeeldingen
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build
        run: npm run build
